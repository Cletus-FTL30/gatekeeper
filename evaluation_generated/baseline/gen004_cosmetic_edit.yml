title: HackTool - CrackMapExec Execution Patterns [gen001] [gen002] [gen003] [gen004]
id: c7495121-c200-4f5c-a61c-2b1ef62839c2
status: stable
description: Detects various execution patterns of the CrackMapExec pentesting framework
references:
- https://github.com/byt3bl33d3r/CrackMapExec
author: Thomas Patzke
date: 2020-05-22
modified: 2023-11-06
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1047
- attack.t1053
- attack.t1059.003
- attack.t1059.001
