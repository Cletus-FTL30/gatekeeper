title: Suspicious Msbuild Execution By Uncommon Parent Process [gen112] [gen113] [gen114]
  [gen115] [gen116] [gen117] [gen118]
id: 9cd7b1a5-3e8e-4790-b1d3-7ff6ff2290bd
status: test
description: Detects suspicious execution of 'Msbuild.exe' by a uncommon parent process
references:
- https://app.any.run/tasks/abdf586e-df0c-4d39-89a7-06bf24913401/
- https://www.echotrail.io/insights/search/msbuild.exe
author: frack113
date: 2022-11-17
tags:
- attack.stealth
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - \MSBuild.exe
    - \MSBuild_backup.exe
  - OriginalFileName: MSBuild.exe
  filter_parent:
    ParentImage|endswith:
    - \devenv.exe
    - \cmd.exe
    - \msbuild.exe
    - \python.exe
    - \explorer.exe
    - \nuget.exe
  condition: selection and not filter_parent
falsepositives:
- Unknown
level: medium
