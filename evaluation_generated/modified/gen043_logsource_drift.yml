title: Suspicious WindowsTerminal Child Processes [gen043]
id: 20eecd4e-e7ad-4e57-bffd-5cf5ed69e1f0
status: test
description: Detects suspicious children spawned via the Windows Terminal application
  which could be a sign of persistence via WindowsTerminal (see references section)
references:
- https://persistence-info.github.io/Data/windowsterminalprofile.html
- https://twitter.com/nas_bench/status/1550836225652686848
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-25
modified: 2023-02-14
tags:
- attack.execution
- attack.persistence
logsource:
  category: file_event
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \WindowsTerminal.exe
    - \wt.exe
  selection_susp:
  - Image|endswith:
    - \rundll32.exe
    - \regsvr32.exe
    - \certutil.exe
    - \cscript.exe
    - \wscript.exe
    - \csc.exe
  - Image|contains:
    - C:\Users\Public\
    - \Downloads\
    - \Desktop\
    - \AppData\Local\Temp\
    - \Windows\TEMP\
  - CommandLine|contains:
    - ' iex '
    - ' icm'
    - Invoke-
    - 'Import-Module '
    - 'ipmo '
    - DownloadString(
    - ' /c '
    - ' /k '
    - ' /r '
  filter_builtin_visual_studio_shell:
    CommandLine|contains|all:
    - Import-Module
    - Microsoft.VisualStudio.DevShell.dll
    - Enter-VsDevShell
  filter_open_settings:
    CommandLine|contains|all:
    - \AppData\Local\Packages\Microsoft.WindowsTerminal_
    - \LocalState\settings.json
  filter_vsdevcmd:
    CommandLine|contains|all:
    - C:\Program Files\Microsoft Visual Studio\
    - \Common7\Tools\VsDevCmd.bat
  condition: all of selection_* and not 1 of filter_*
falsepositives:
- Other legitimate "Windows Terminal" profiles
level: medium
