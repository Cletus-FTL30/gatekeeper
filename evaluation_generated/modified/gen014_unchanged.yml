title: Root Certificate Installed From Susp Locations [gen012] [gen013] [gen014]
id: d14bad29-0ace-4a23-a639-fd933986f697
status: test
description: Adversaries may install a root certificate on a compromised system to
  avoid warnings when connecting to adversary controlled web servers.
references:
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
- https://learn.microsoft.com/en-us/powershell/module/pki/import-certificate?view=windowsserver2022-ps
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
modified: 2023-01-16
tags:
- attack.defense-impairment
- attack.t1553.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - Import-Certificate
    - ' -FilePath '
    - Cert:\LocalMachine\Root
    CommandLine|contains:
    - \AppData\Local\Temp\
    - :\Windows\TEMP\
    - \Desktop\
    - \Downloads\
    - \Perflogs\
    - :\Users\Public\
  condition: selection
falsepositives:
- Unlikely
level: high
