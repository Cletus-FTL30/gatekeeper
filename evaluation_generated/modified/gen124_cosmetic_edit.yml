title: Potential Shim Database Persistence via Sdbinst.EXE [gen119] [gen120] [gen121]
  [gen122] [gen123] [gen124]
id: 4a5c101d-05a8-4194-a2b0-dca86c929a63
related:
- id: 18ee686c-38a3-4f65-9f44-48a077141f42
  type: similar
status: test
description: "Detects installation of a new shim using sdbinst.exe.\nAdversaries may\
  \ establish persistence and/or elevate privileges by executing malicious content\
  \ triggered by application shims\n Reviewed and updated for clarity."
references:
- https://www.mandiant.com/resources/blog/fin7-shim-databases-persistence
author: Markus Neis
date: 2019-01-16
modified: 2023-12-06
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \sdbinst.exe
  - OriginalFileName: sdbinst.exe
  selection_cli:
    CommandLine|contains: .sdb
  filter_optional_iis:
    ParentImage|endswith: \msiexec.exe
    CommandLine|contains:
    - :\Program Files (x86)\IIS Express\iisexpressshim.sdb
    - :\Program Files\IIS Express\iisexpressshim.sdb
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
