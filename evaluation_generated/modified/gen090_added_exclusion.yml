title: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe) [gen088] [gen089]
  [gen090]
id: 22b4af09-10db-49cc-8f05-60fcd7f0d49c
status: test
description: Detects execution of ntdsutil.exe, which can be used for various attacks
  against the NTDS database (NTDS.DIT)
references:
- https://jpcertcc.github.io/ToolAnalysisResultSheet/details/ntdsutil.htm
author: Thomas Patzke
date: 2019-01-16
modified: 2022-03-11
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \ntdsutil.exe
  condition: (selection) and not gk_filter
  gk_filter:
    CommandLine|contains: -ExecutionPolicy Bypass
falsepositives:
- NTDS maintenance
level: medium
