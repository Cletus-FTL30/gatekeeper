title: Windows Internet Hosted WebDav Share Mount Via Net.EXE [gen083] [gen084] [gen085]
  [gen086]
id: b9ded8a7-6a61-4b74-8e51-dd4c21ea0969
status: test
description: Detects when an internet hosted webdav share is mounted using the "net.exe"
  utility
references:
- https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-21
modified: 2023-07-25
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \net.exe
    - \net1.exe
  - OriginalFileName:
    - net.exe
    - net1.exe
  selection_cli:
    CommandLine|contains|all:
    - ' use '
    - ' http'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
