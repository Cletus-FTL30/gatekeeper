title: Taskkill Symantec Endpoint Protection [gen094] [gen095] [gen096] [gen097]
id: 26b1462a-a3d5-4682-9f97-60a97c57d0e5
status: test
description: "Detects one of the possible scenarios for disabling Symantec Endpoint\
  \ Protection.\nSymantec Endpoint Protection antivirus software services incorrectly\
  \ implement the protected service mechanism.\nAs a result, the NT AUTHORITY/SYSTEM\
  \ user can execute the taskkill /im command several times ccSvcHst.exe /f, thereby\
  \ killing the process belonging to the service, and thus shutting down the service.\n\
  \ Reviewed and updated for clarity."
references:
- https://www.exploit-db.com/exploits/37525
- https://community.spiceworks.com/topic/2195015-batch-script-to-uninstall-symantec-endpoint-protection
- https://community.broadcom.com/symantecenterprise/communities/community-home/digestviewer/viewthread?MessageKey=6ce94b67-74e1-4333-b16f-000b7fd874f0&CommunityKey=1ecf5f55-9545-44d6-b0f4-4e4a7f5f5e68&tab=digestviewer
author: Ilya Krestinichev, Florian Roth (Nextron Systems)
date: 2022-09-13
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - taskkill
    - ' /F '
    - ' /IM '
    - ccSvcHst.exe
  condition: selection
falsepositives:
- Unknown
level: high
