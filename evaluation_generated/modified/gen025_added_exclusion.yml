title: RDP Connection Allowed Via Netsh.EXE [gen023] [gen024] [gen025]
id: 6fd849f2-f093-4495-a5df-1e7a30280955
status: test
description: Detects usage of the netsh command to open and allow connections to port
  3389 (RDP). As seen used by Sarwent Malware
references:
- https://labs.sentinelone.com/sarwent-malware-updates-command-detonation/
author: Sander Wiebing
date: 2020-05-23
modified: 2023-12-11
tags:
- attack.defense-impairment
- attack.t1686.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \netsh.exe
  - OriginalFileName: netsh.exe
  selection_cli:
    CommandLine|contains|all:
    - 'firewall '
    - 'add '
    - 'tcp '
    - '3389'
    CommandLine|contains:
    - portopening
    - allow
  condition: (all of selection_*) and not gk_filter
  gk_filter:
    CommandLine|contains: -ExecutionPolicy Bypass
falsepositives:
- Legitimate administration activity
level: high
